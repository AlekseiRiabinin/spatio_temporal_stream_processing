cityrover {

  kafka {
    bootstrap = "kafka-1:19092"

    topics {
      raw-telemetry      = "rover-telemetry-raw"
      enriched-telemetry = "rover-telemetry-enriched"
      analytics          = "rover-analytics"
    }
  }

  iceberg {

    # Spark catalog name → spark.sql.catalog.cityrover
    catalog = "cityrover"

    # HiveCatalog namespace (Iceberg database)
    namespace = "cityrover"

    # Target Iceberg table
    table = "telemetry_raw"

    # Explicit Iceberg table location
    table-location = "s3a://cityrover-iceberg/tables/telemetry_raw"

    # Structured Streaming checkpoint (stored in MinIO)
    checkpoint = "s3a://cityrover-iceberg/checkpoints/trajectory-lakehouse-writer"

    # Hive Metastore URI
    metastore-uri = "thrift://hive-metastore:9083"

    s3 {
      endpoint          = "http://minio:9002"
      access-key-id     = "minioadmin"
      secret-access-key = "minioadmin"
      path-style-access = true
    }
  }
}
