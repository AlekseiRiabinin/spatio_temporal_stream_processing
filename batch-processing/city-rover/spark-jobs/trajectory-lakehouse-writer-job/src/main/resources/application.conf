cityrover {

  # ================================================================
  # Kafka
  # ================================================================

  kafka {

    # Kafka bootstrap servers
    bootstrap = "kafka-1:19092"

    # Kafka topics
    topics {

      raw-telemetry = "rover-telemetry-raw"

      enriched-telemetry = "rover-telemetry-enriched"

      analytics = "rover-analytics"
    }
  }


  # ================================================================
  # Iceberg
  # ================================================================

  iceberg {

    # Spark catalog name
    #
    # This produces:
    #
    # spark.sql.catalog.cityrover
    #
    catalog = "cityrover"

    # Iceberg warehouse
    warehouse = "s3a://cityrover-iceberg/warehouse"

    # Iceberg namespace/database
    namespace = "cityrover"

    # Target table
    table = "telemetry_raw"

    # Structured Streaming checkpoint
    checkpoint =
      "s3a://cityrover-iceberg/checkpoints/trajectory-lakehouse-writer"


    # --------------------------------------------------------------
    # S3 / MinIO
    # --------------------------------------------------------------

    s3 {

      # MinIO S3 endpoint
      endpoint = "http://minio:9002"

      # Development credentials
      #
      # IMPORTANT:
      # Do not keep real production credentials in Git.
      #

      access-key-id = "minioadmin"

      secret-access-key = "minioadmin"

      # Required for MinIO
      path-style-access = true
    }
  }
}
