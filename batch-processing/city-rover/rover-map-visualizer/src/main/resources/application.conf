visualizer {

  # Directory where trajectory-visualizer-job writes GeoJSON files
  # Example:
  #   /opt/spark/work-dir/pipelines/trajectory-viewer/output/geojson/<roverId>.json
  outputDir = "/opt/spark/work-dir/pipelines/trajectory-viewer/output"

  # Static web assets (index.html, js/, css/)
  webRoot = "web"
}

graph {
  # Graph-engine output directory (nodes/edges parquet or geojson)
  # Example:
  #   /opt/cityrover/graph-engine/output/nodes.parquet
  #   /opt/cityrover/graph-engine/output/edges.parquet
  outputDir = "/opt/cityrover/graph-engine/output"
}

server {
  host = "0.0.0.0"
  port = 8080
}
