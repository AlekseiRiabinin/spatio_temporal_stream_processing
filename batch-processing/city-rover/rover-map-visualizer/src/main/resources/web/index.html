<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <title>CityRover - Map Visualizer</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    />

    <!-- Application CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    />

</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">

        <h2>Rovers</h2>

        <div id="rover-list"></div>


        <h2>Controls</h2>

        <div id="controls">

            <!-- Show all rover trajectories -->
            <button id="btn-show-all-trajectories">
                Show All Trajectories
            </button>

            <!-- Show selected rover trajectory -->
            <button id="btn-show-trajectory">
                Show Trajectory
            </button>

            <!-- Replay -->
            <button id="btn-start-replay">
                Start Replay
            </button>

            <button id="btn-stop-replay">
                Stop Replay
            </button>

            <!-- Graph -->
            <button id="btn-show-graph">
                Show Graph
            </button>

        </div>

    </div>


    <!-- Map -->
    <div id="map"></div>


    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>


    <!-- App modules -->
    <script src="web/js/map.js"></script>
    <script src="web/js/app.js"></script>
    <script src="web/js/trajectory.js"></script>
    <script src="web/js/replay.js"></script>
    <script src="web/js/graph.js"></script>

</body>

</html>
