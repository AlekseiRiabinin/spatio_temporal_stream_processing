<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>CityRover - Map Visualizer</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-sA+zWATbFveLLNqkHkA+gJpVt6k9Jf2zYt2f5x4wP3s="
        crossorigin=""
    />

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h2>Rovers</h2>
        <div id="rover-list"></div>

        <h2>Controls</h2>
        <div id="controls">
            <button id="btn-show-trajectory">Show Trajectory</button>
            <button id="btn-start-replay">Start Replay</button>
            <button id="btn-stop-replay">Stop Replay</button>
            <button id="btn-show-graph">Show Graph</button>
        </div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-o9N1j7kGStpZ0pniS3pS3kMt2rt7NmQG3pZ+Z1ZqzU8="
        crossorigin=""
    ></script>

    <!-- App modules -->
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
    <script src="js/trajectory.js"></script>
    <script src="js/replay.js"></script>
    <script src="js/graph.js"></script>

</body>
</html>
