blob:
  server:
    port: '6124'
taskmanager:
  memory:
    process:
      size: 1728m
  numberOfTaskSlots: '4'
metrics:
  reporter:
    prom:
      port: '9093'
      factory:
        class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
  reporters: prom
python:
  metric:
    enabled: true
  client:
    executable: /opt/venv/bin/python3
  executable: /opt/venv/bin/python3
jobmanager:
  rpc:
    address: flink-jobmanager-fs
  memory:
    process:
      size: 1600m
query:
  server:
    port: '6125'
parallelism:
  default: 1
env:
  java:
    opts:
      all: -XX:+UseZGC -XX:+ZGenerational -XX:ZUncommitDelay=30 -XX:+AlwaysPreTouch
