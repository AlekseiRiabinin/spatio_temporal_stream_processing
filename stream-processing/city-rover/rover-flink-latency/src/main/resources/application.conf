cityrover {

  kafka {
    bootstrap = "localhost:9092"

    topics {
      raw-telemetry = "raw-telemetry"
    }
  }

  pipeline {
    # Watermark delay for out-of-order telemetry
    watermark-delay-ms = 3000

    # Window size for metrics aggregation
    window-size-ms = 5000
  }

  latency {
    profiler {
      # Enable latency sampling
      enabled = true

      # Sample every Nth event
      sample-rate = 100
    }
  }
}
