status = error
name = CityRoverLogConfig

# -------------------------------------------------------------------
# Console appender (Flink-compatible, synchronous for stable latency)
# -------------------------------------------------------------------
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d{HH:mm:ss.SSS}] %-5p [%t] %c{1} - %m%n

# -------------------------------------------------------------------
# Root logger
# -------------------------------------------------------------------
rootLogger.level = info
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = ConsoleAppender

# -------------------------------------------------------------------
# Reduce Flink internal logging noise
# -------------------------------------------------------------------
logger.flink.name = org.apache.flink
logger.flink.level = warn

logger.kafka.name = org.apache.kafka
logger.kafka.level = warn

logger.netty.name = io.netty
logger.netty.level = warn

# -------------------------------------------------------------------
# Project logs
# -------------------------------------------------------------------
logger.cityrover.name = cityrover
logger.cityrover.level = info
logger.cityrover.additivity = false
logger.cityrover.appenderRefs = console
logger.cityrover.appenderRef.console.ref = ConsoleAppender
