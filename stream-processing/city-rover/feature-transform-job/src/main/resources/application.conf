cityrover {

  kafka {
    bootstrap = "kafka-1:19092"

    topics {
      raw-telemetry      = "rover-telemetry-protobuf"
      enriched-telemetry = "rover-telemetry-enriched"
    }

    consumer-group = "cityrover-feature-transform"
  }

  pipeline {

    # Disable event-time watermarks for lowest latency.
    # Online feature stores use processing-time windows.
    watermark-delay-ms = 0

    windows {

      # Ultra-short-term behavior (jerk, sudden turns)
      window-5s {
        enabled = true
        size-sec = 5
      }

      # Short-term behavior (speed variance, stops)
      window-30s {
        enabled = true
        size-sec = 30
      }

      # Medium-term behavior (idle ratio, congestion)
      window-1m {
        enabled = true
        size-sec = 60
      }

      # Longer-term behavior (route-level dynamics)
      window-5m {
        enabled = true
        size-sec = 300
      }
    }
  }

  # ==========================================================
  # Metrics
  # ==========================================================
  #
  # Mirrors the latency decomposition used by the PyFlink probes
  # (kafka_latency_probe.py, cassandra_latency_probe.py):
  #
  #   t1_ms                = Kafka broker timestamp (ctx.timestamp())
  #   t_src_ms             = wall clock when record leaves source
  #   t_transform_start_ms = wall clock right before eviction+compute
  #   t_transform_done_ms  = wall clock after serving row is built
  #   t_sink_enqueue_ms    = wall clock right after yield to KafkaSink
  #
  #   kafka_to_flink_ms    = t_src_ms             - t1_ms
  #   queue_ms             = t_transform_start_ms - t_src_ms
  #   transform_ms         = t_transform_done_ms  - t_transform_start_ms
  #   emit_ms              = t_sink_enqueue_ms    - t_transform_done_ms
  #   latency_ms           = t_sink_enqueue_ms    - t1_ms
  #
  #   latency_ms == kafka_to_flink_ms + queue_ms + transform_ms + emit_ms
  #
  # The Flink Prometheus reporter is enabled by config.yaml on the
  # JobManager / TaskManager side; application.conf only tells the job
  # WHICH metrics to register and under WHAT names.
  #
  metrics {

    prometheus {
      enabled   = true
      namespace = "cityrover_feature_transform"
    }

    # Metric family prefix used inside the Flink MetricGroup.
    # Final Prometheus names look like:
    #   flink_taskmanager_job_task_operator_<group>_<metric>
    # e.g. flink_taskmanager_job_task_operator_cityrover_transform_transform_ms
    metric-group = "cityrover"

    # Which latency stages to register as Dropwizard histograms.
    # Flip any of these to false to reduce metric-cardinality if needed.
    register {
      kafka-to-flink = true    # broker -> source emission
      queue          = true    # source emission -> transform start
      transform      = true    # transform start -> transform done
      emit           = true    # transform done -> sink enqueue
      end-to-end     = true    # broker -> sink enqueue (= latency_ms)
    }

    # Dropwizard reservoir configuration.
    # SlidingWindowReservoir gives true percentiles over the last N samples;
    # ExponentiallyDecayingReservoir is cheaper but biased toward recent values.
    # For a latency probe, SlidingWindowReservoir is the right choice.
    reservoir {
      type          = "sliding-window"   # or "exponentially-decaying"
      window-size   = 1028                # number of samples retained for percentiles
    }

    # Sampling policy: how often to record a latency sample per operator subtask.
    # 1.0 = every record (precise but higher overhead).
    # 0.1 = one in ten (cheaper, still representative for large volumes).
    sample-rate = 1.0

    # Extra Prometheus-friendly tags attached to every metric.
    # Flink already adds job/task/operator labels automatically; these are
    # additional domain labels that help when both jobs write to the same
    # Prometheus instance (e.g. filter by `pipeline = "transform"`).
    tags {
      job       = "feature-transform-job"
      pipeline  = "transform"
      component = "flink"
    }
  }

  feature-store {
    version = "v1"
    # Used for metadata fields in EnrichedEvent
  }
}
