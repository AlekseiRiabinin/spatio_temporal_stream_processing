# =============================================================================
# feature-writer-zio
#
# Consumes enriched telemetry (protobuf) from the Kafka enriched topic,
# dispatches per-window on the `oneof features` variant, and upserts only
# that window's columns to Cassandra with event-time USING TIMESTAMP.
#
# The wire format is identical to feature-transform-job / feature-transform-zio.
# See src/main/protobuf/telemetry.proto (shared proto).
# =============================================================================

cityrover {

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka {
    bootstrapServers = "localhost:9092"
    bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}

    # Enriched telemetry topic (protobuf, one partial record per window
    # firing, key = roverId). Produced by feature-transform-zio.
    enrichedTopic = "rover-telemetry-enriched"
    enrichedTopic = ${?KAFKA_ENRICHED_TOPIC}

    # Consumer group for the enriched topic. Distinct from the transform
    # job's groupId (which reads the raw topic) — different topics, different
    # groups, independent offsets.
    groupId = "feature-writer-zio"
    groupId = ${?KAFKA_GROUP_ID}

    # -------------------------------------------------------------------------
    # Consumer tuning
    # -------------------------------------------------------------------------
    consumer {
      # 'latest' on fresh deploy; 'earliest' only when backfilling.
      offsetReset = "latest"
      offsetReset = ${?KAFKA_CONSUMER_OFFSET_RESET}

      # Low values so records aren't batched waiting for more data —
      # matches the "immediate write to Cassandra" freshness goal.
      fetchMinBytes = 1
      fetchMaxWaitMs = 50

      # Kafka-side isolation level. read_uncommitted matches the
      # at-least-once sink on the transform side. If the transform sink
      # is ever switched to exactly-once (transactions), this becomes
      # read_committed and the writer sees records only after checkpoint
      # commit — introducing checkpoint-interval latency on every record.
      isolationLevel = "read_uncommitted"
      isolationLevel = ${?KAFKA_CONSUMER_ISOLATION_LEVEL}

      # Max parallelism for partition-level streams (zio-kafka uses
      # plainStream by default; this is a future knob for partitionedStream).
      partitionStreamParallelism = 4
    }
  }

  # ---------------------------------------------------------------------------
  # Cassandra
  #
  # One row per rover; each window's partial record upserts ONLY its own
  # columns. USING TIMESTAMP = windowEndTs * 1000 makes replays idempotent
  # and reordering-safe (LWW).
  # ---------------------------------------------------------------------------
  cassandra {
    # Comma-separated contact points. Driver picks the closest; a single
    # node is fine for dev, three for prod.
    contactPoints = "localhost"
    contactPoints = ${?CASSANDRA_CONTACT_POINTS}

    port = 9042
    port = ${?CASSANDRA_PORT}

    # Local datacenter name — must match the cluster's DC (default is
    # "datacenter1" in a single-DC dev install; use the real name in prod).
    localDatacenter = "datacenter1"
    localDatacenter = ${?CASSANDRA_LOCAL_DC}

    keyspace = "cityrover"
    keyspace = ${?CASSANDRA_KEYSPACE}

    table = "rover_features"
    table = ${?CASSANDRA_TABLE}

    # Optional auth. Empty string means "no auth" (dev). For prod, set
    # CASSANDRA_USERNAME / CASSANDRA_PASSWORD.
    username = ""
    username = ${?CASSANDRA_USERNAME}

    password = ""
    password = ${?CASSANDRA_PASSWORD}

    # -------------------------------------------------------------------------
    # Driver tuning
    # -------------------------------------------------------------------------
    driver {
      # Request timeout for individual statements. The writer uses
      # executeAsync and relies on ZIO backpressure, so a slow request
      # should time out (and fail the stream) rather than accumulate.
      requestTimeoutSeconds = 10
      requestTimeoutSeconds = ${?CASSANDRA_REQUEST_TIMEOUT_SECONDS}

      # Connection pool: how many concurrent requests per connection.
      # Higher = more throughput, at the cost of more memory on the
      # driver side. The writer's own backpressure (ZIO Streams demand)
      # limits in-flight writes; this is the per-connection cap.
      maxRequestsPerConnection = 1024
      maxRequestsPerConnection = ${?CASSANDRA_MAX_REQUESTS_PER_CONNECTION}

      # Consistency level for writes. LOCAL_QUORUM is the usual choice
      # for multi-DC. For a single-node dev cluster, LOCAL_ONE is fine.
      consistency = "LOCAL_QUORUM"
      consistency = ${?CASSANDRA_CONSISTENCY}
    }
  }

  # ---------------------------------------------------------------------------
  # Metrics
  #
  # Exposed via zio-metrics-connectors-prometheus on `httpPort`.
  # Mirrors the Flink writer job's metric names so dashboards are shared:
  #   kafka_to_flink_ms  — broker timestamp → consumer parse
  #   flink_ms           — parse → sink start (queue time)
  #   write_ms           — sink start → Cassandra completion
  #   latency_ms         — broker timestamp → Cassandra completion
  # ---------------------------------------------------------------------------
  metrics {
    enabled = true
    enabled = ${?METRICS_ENABLED}

    namespace = "cityrover_writer_zio"
    namespace = ${?METRICS_NAMESPACE}

    # Subgroup label for all writer histograms.
    subgroup = "writer"

    httpPort = 9085
    httpPort = ${?METRICS_HTTP_PORT}

    # Histogram buckets in milliseconds. Cassandra writes are usually
    # sub-millisecond to low tens of ms; the upper buckets catch
    # overload / GC-pause scenarios.
    histogramBucketsMs = [0.5, 1, 2, 5, 10, 25, 50, 100, 250, 500, 1000]

    register {
      kafkaToFlink = true
      queue        = true   # flink_ms (parse → sink start)
      transform    = true   # write_ms (sink start → completion)
      emit         = false  # writer doesn't produce to Kafka
      endToEnd     = true   # latency_ms
    }
  }

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  app {
    logLevel = "INFO"
    logLevel = ${?LOG_LEVEL}

    # Graceful shutdown: wait up to this long for in-flight Cassandra
    # executeAsync futures to complete after SIGTERM before forcing exit.
    shutdownDrainTimeoutSeconds = 30
    shutdownDrainTimeoutSeconds = ${?SHUTDOWN_DRAIN_TIMEOUT_SECONDS}
  }
}
