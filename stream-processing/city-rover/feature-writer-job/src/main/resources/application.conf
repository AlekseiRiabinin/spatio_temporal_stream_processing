cityrover {

  kafka {
    bootstrap = "kafka-1:19092"

    topics {
      enriched-telemetry = "rover-telemetry-enriched"
    }

    consumer-group = "cityrover-consumer"
  }

  cassandra {
    host = "cassandra"
    port = 9042
    keyspace = "cityrover"
    table = "telemetry_enriched"

    write {
      batch-size = 50
      max-retries = 3
    }
  }

  pipeline {
    # Writer job does not use event-time windows.
    watermark-delay-ms = 0
  }

  # ==========================================================
  # Metrics
  # ==========================================================
  #
  # Mirrors the latency decomposition used by the PyFlink probes
  # (cassandra_latency_probe.py):
  #
  #   t1_ms             = Kafka broker timestamp (ctx.timestamp())
  #   t_src_ms          = wall clock when record leaves source
  #   t_write_start_ms  = wall clock right before session.execute()
  #   t2_ms             = wall clock right after session.execute() returns
  #
  #   kafka_to_flink_ms = t_src_ms         - t1_ms
  #   flink_ms          = t_write_start_ms - t_src_ms
  #   write_ms          = t2_ms            - t_write_start_ms
  #   latency_ms        = t2_ms            - t1_ms
  #
  #   latency_ms == kafka_to_flink_ms + flink_ms + write_ms
  #
  # Note: the writer job has no Kafka sink and no transform stage,
  # so emit_ms and transform_ms are not registered here. The
  # `register` toggles below reflect that.
  #
  metrics {

    prometheus {
      enabled   = true
      namespace = "cityrover_feature_writer"
    }

    # Metric family prefix used inside the Flink MetricGroup.
    # Final Prometheus names look like:
    #   flink_taskmanager_job_task_operator_<group>_<subgroup>_<metric>
    # e.g. flink_taskmanager_job_task_operator_cityrover_writer_write_ms
    metric-group = "cityrover"

    # Which latency stages to register as Dropwizard histograms.
    # The writer job measures three stages: source lag, in-pipeline time,
    # and the Cassandra write round trip. emit_ms and transform_ms are
    # deliberately disabled — they would always be zero here.
    register {
      kafka-to-flink = true    # broker -> source emission
      queue          = true    # source emission -> write start (a.k.a. flink_ms)
      transform      = false   # no transformation in the writer job
      emit           = false   # no Kafka sink in the writer job
      end-to-end     = true    # broker -> after Cassandra write (= latency_ms)
    }

    # Dropwizard reservoir configuration.
    # SlidingWindowReservoir gives true percentiles over the last N samples.
    reservoir {
      type        = "sliding-window"
      window-size = 1028
    }

    # Sampling policy: 1.0 = every record.
    sample-rate = 1.0

    # Extra Prometheus-friendly tags attached to every metric.
    # Flink adds job/task/operator labels automatically; these additional
    # labels help distinguish the two jobs in a shared Prometheus instance.
    tags {
      job       = "feature-writer-job"
      pipeline  = "writer"
      component = "flink"
    }
  }
}
