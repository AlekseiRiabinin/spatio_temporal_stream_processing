# =============================================================================
# feature-transform-zio
#
# Consumes raw telemetry (protobuf) from Kafka, computes four tumbling
# event-time windows per rover (5s / 30s / 1m / 5m), and produces one
# partial enriched record per window firing to the enriched topic.
#
# The wire format is identical to feature-transform-job. See
# src/main/protobuf/telemetry.proto (shared with the writer job).
# =============================================================================

cityrover {

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka {
    # Comma-separated bootstrap servers.
    bootstrapServers = "localhost:9092"
    bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}

    # Raw telemetry topic (protobuf, produced by the Kafka Connect
    # json-to-protobuf pipeline or equivalent).
    rawTopic = "rover-telemetry-raw"
    rawTopic = ${?KAFKA_RAW_TOPIC}

    # Enriched telemetry topic (protobuf, one partial record per window
    # firing, key = roverId).
    enrichedTopic = "rover-telemetry-enriched"
    enrichedTopic = ${?KAFKA_ENRICHED_TOPIC}

    # Consumer group for the raw topic.
    groupId = "feature-transform-zio"
    groupId = ${?KAFKA_GROUP_ID}

    # -------------------------------------------------------------------------
    # Consumer tuning
    # -------------------------------------------------------------------------
    consumer {
      # Start from 'latest' in production; use 'earliest' when backfilling.
      offsetReset = "latest"
      offsetReset = ${?KAFKA_CONSUMER_OFFSET_RESET}

      # Low values so records aren't batched waiting for more data.
      # Aligns with the "immediate write" freshness goal.
      fetchMinBytes = 1
      fetchMaxWaitMs = 50

      # Per-partition parallelism in zio-kafka. One stream per partition.
      # Set to the number of partitions in rawTopic for full throughput.
      partitionStreamParallelism = 4
    }

    # -------------------------------------------------------------------------
    # Producer tuning
    # -------------------------------------------------------------------------
    producer {
      # 1 = leader ack only (fastest, at-least-once with retries).
      # "all" = full ISR ack (durable, slightly slower).
      # At-least-once is sufficient here: enriched records are idempotent
      # on the writer side (event-time USING TIMESTAMP + partial upsert).
      acks = "1"
      acks = ${?KAFKA_PRODUCER_ACKS}

      # Don't linger: the window firing already batches per rover.
      lingerMs = 0

      # Compress for throughput; lz4 is the usual balance.
      compressionType = "lz4"
      compressionType = ${?KAFKA_PRODUCER_COMPRESSION}

      # Retries for transient broker issues. Same idempotency argument
      # as above: a duplicate is harmless downstream.
      retries = 5

      # Bounded in-flight per partition. >1 can reorder on retry, but
      # duplicates are idempotent, so we accept it for throughput.
      maxInFlightRequestsPerConnection = 5
    }
  }

  # ---------------------------------------------------------------------------
  # Windowing
  #
  # Four tumbling event-time windows, aligned to epoch, all sharing the
  # same allowed-lateness / idleness policy as feature-transform-job.
  # ---------------------------------------------------------------------------
  window {
    size5sSeconds  = 5
    size30sSeconds = 30
    size1mSeconds  = 60
    size5mSeconds  = 300

    # Same as Flink forBoundedOutOfOrderness(5s). A window fires when
    # watermark >= windowEnd, where watermark = max(ts) - allowedLatenessMs.
    allowedLatenessMs = 5000
    allowedLatenessMs = ${?WINDOW_ALLOWED_LATENESS_MS}

    # Same as Flink withIdleness(30s). A rover that stops sending has
    # its pending windows force-fired after this period, so downstream
    # doesn't stall on a silent rover. Requires a periodic tick in the
    # stream (see EventTimeWindow.scala).
    idlenessMs = 30000
    idlenessMs = ${?WINDOW_IDLENESS_MS}

    # Optional: cap per-rover window state. If the stream is broken and
    # watermarks never advance, unbounded accumulators can grow. When
    # exceeded, the oldest pending window for that rover is force-fired
    # and a warning is logged.
    maxPendingWindowsPerRover = 16
  }

  # ---------------------------------------------------------------------------
  # Metrics
  #
  # Exposed via zio-metrics-connectors-prometheus on `httpPort`.
  # Mirrors the feature-transform-job metric names so dashboards and
  # alerts are shared between the Flink and ZIO implementations.
  # ---------------------------------------------------------------------------
  metrics {
    enabled = true
    enabled = ${?METRICS_ENABLED}

    namespace = "cityrover_transform_zio"
    namespace = ${?METRICS_NAMESPACE}

    # Subgroup prefix appended to each metric name.
    # Records appear as, e.g.:
    #   cityrover_transform_zio_window_5s_transform_ms
    subgroup = "window"

    httpPort = 9084
    httpPort = ${?METRICS_HTTP_PORT}

    # Histogram buckets in milliseconds. Covers sub-millisecond to
    # five-minute p99 for the 5m window's transform stage.
    histogramBucketsMs = [0.5, 1, 2, 5, 10, 25, 50, 100, 250, 500, 1000, 5000]

    # Register which stages. Mirrors MetricsConfig.register in the
    # Flink jobs (kafka_to_flink / queue / transform / emit / end_to_end).
    register {
      kafkaToFlink = true
      queue        = true
      transform    = true
      emit         = true
      endToEnd     = true
    }
  }

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  app {
    # Log level for the job; overridden by LOG_LEVEL env var.
    logLevel = "INFO"
    logLevel = ${?LOG_LEVEL}

    # Graceful shutdown: how long to wait for in-flight Kafka produce
    # futures to drain after SIGTERM before forcing exit.
    shutdownDrainTimeoutSeconds = 30
    shutdownDrainTimeoutSeconds = ${?SHUTDOWN_DRAIN_TIMEOUT_SECONDS}
  }
}
