services:

  graph-engine:
    build:
      context: ../batch-processing/city-rover/graph-engine
      dockerfile: Dockerfile
    container_name: cityrover-graph-engine
    volumes:
      - graph-data:/opt/cityrover/graph-engine/output
      - ../data/maps:/app/data/maps
    networks:
      - city-rover-net
    environment:
      POSTGIS_HOST: postgis-real-deal
      POSTGIS_PORT: 5432
      POSTGIS_DB: cre_db
      POSTGIS_USER: cre_user
      POSTGIS_PASSWORD: cre_password
      JAVA_OPTS: "-Xmx4g"
    restart: "no"

  rover-simulator:
    build:
      context: ../batch-processing/city-rover/rover-simulator
      dockerfile: Dockerfile
    container_name: cityrover-rover-simulator
    depends_on:
      graph-engine:
        condition: service_completed_successfully
      kafka-1:
        condition: service_started
    volumes:
      - graph-data:/opt/cityrover/graph-engine/output
    networks:
      - city-rover-net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092
      JAVA_OPTS: "-Xmx4g"

  kafka-1:
    image: apache/kafka:3.8.0
    container_name: kafka-1
    ports:
      - "19092:19092"
      - "19093:19093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:19093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: d8ce1515-401e-44d4-a444-1b6dba479047
    networks:
      - city-rover-net
    restart: always

  minio-setup:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_started
    entrypoint: |
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 25;

      if ! command -v curl >/dev/null 2>&1; then
        echo 'Installing curl...';
        apt-get update && apt-get install -y curl;
      fi
      
      until curl -s http://minio:9002/minio/health/live >/dev/null; do
        echo 'Waiting for MinIO health endpoint...';
        sleep 5;
      done
      
      if command -v mc >/dev/null 2>&1; then
        mc alias set local http://minio:9002 minioadmin minioadmin;
        mc mb local/trino-data-lake || true;
        mc mb local/trino-warehouse || true;
        mc mb local/trino-catalog || true;
        mc mb local/spark-data || true;
        mc mb local/airflow-logs || true;
        mc anonymous set download local/trino-data-lake || true;
        echo 'MinIO buckets initialized successfully';
      else
        echo 'MC client not available, using API calls instead';

        for bucket in trino-data-lake trino-warehouse trino-catalog spark-data airflow-logs; do
          curl -X PUT http://minio:9002/$bucket -H 'Content-Length: 0' || true;
        done
        echo 'Buckets created via API';
      fi
      "
    networks:
      - kafka-net
    restart: on-failure

  trajectory-visualizer-job:
    build:
      context: ../batch-processing/city-rover/spark-jobs/trajectory-visualizer-job
      dockerfile: Dockerfile
    container_name: cityrover-trajectory-visualizer-job
    depends_on:
      kafka-1:
        condition: service_started
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092
      JAVA_OPTS: "-Xmx2g"
    volumes:
      - graph-data:/opt/cityrover/graph-engine/output
    networks:
      - city-rover-net
    restart: "no"

  rover-map-visualizer:
    build:
      context: ../batch-processing/city-rover/rover-map-visualizer
      dockerfile: Dockerfile
    container_name: cityrover-map-visualizer
    environment:
      VISUALIZER_OUTPUT_DIR: /opt/spark/work-dir/pipelines/trajectory-viewer/output
      VISUALIZER_WEBROOT: web
      JAVA_OPTS: "-Xmx512m"
    volumes:
      - trajectory-data:/opt/spark/work-dir/pipelines/trajectory-viewer/output
    ports:
      - "8080:8080"
    networks:
      - city-rover-net
    restart: always

  trajectory-lakehouse-writer-job:
    build:
      context: ../batch-processing/city-rover/spark-jobs/trajectory-lakehouse-writer-job
      dockerfile: Dockerfile
    container_name: cityrover-trajectory-lakehouse-writer-job
    depends_on:
      kafka-1:
        condition: service_started
      spark-master:
        condition: service_started
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_EC2_METADATA_DISABLED: "true"
      CITYROVER_ICEBERG_S3_ENDPOINT: http://minio:9002
      CITYROVER_ICEBERG_S3_ACCESS_KEY: minioadmin
      CITYROVER_ICEBERG_S3_SECRET_KEY: minioadmin
      CITYROVER_KAFKA_BOOTSTRAP: kafka-1:19092
      CITYROVER_ICEBERG_CATALOG: cityrover
      CITYROVER_ICEBERG_WAREHOUSE: s3://cityrover-iceberg/warehouse
      CITYROVER_ICEBERG_NAMESPACE: cityrover
      CITYROVER_ICEBERG_TABLE: telemetry_raw
      CITYROVER_ICEBERG_CHECKPOINT: s3://cityrover-iceberg/checkpoints/trajectory-lakehouse-writer
      CITYROVER_ICEBERG_S3_PATH_STYLE_ACCESS: "true"
    networks:
      - city-rover-net
    restart: "no"

volumes:
  graph-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aleksei/Projects/telecom_analytics_4.0/spark/pipelines/trajectory-viewer/output

  trajectory-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aleksei/Projects/telecom_analytics_4.0/spark/pipelines/trajectory-viewer/output

networks:
  city-rover-net:
    external: true
    name: city-rover-net


