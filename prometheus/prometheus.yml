global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: 'flink-jobmanager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flink-jobmanager-fs:9093']

  - job_name: 'flink-taskmanager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flink-taskmanager-fs:9093']

  - job_name: 'flink-custom-metrics-transform'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flink-taskmanager-fs:9099']

  - job_name: 'flink-custom-metrics-writer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flink-taskmanager-fs:9101']

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9002']